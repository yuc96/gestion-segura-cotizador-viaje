services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "43123:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://127.0.0.1:43123
      APP_LOCALE: es
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: gestion_segura
      DB_USERNAME: seguro
      DB_PASSWORD: seguro
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      RESTCOUNTRIES_API_KEY: ${RESTCOUNTRIES_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: gestion_segura
      MYSQL_USER: seguro
      MYSQL_PASSWORD: seguro
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "33060:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:

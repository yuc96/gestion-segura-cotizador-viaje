name: tests

on:
  push:
  pull_request:

jobs:
  pest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, curl, zip, mysql, bcmath, intl, gd, sqlite
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias PHP
        run: composer install --no-interaction --prefer-dist

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Ejecutar Pest
        run: php artisan test

      - name: Compilar Vue
        run: npm ci && npm run build

      - name: Probar el formulario en el navegador de Node
        run: node --experimental-strip-types --test tests/js/formHelpers.test.ts
